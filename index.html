<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Tally</title>
<style>
  :root{
    --tt-green:#22B49B;
    --tt-green-dark:#12907C;
    --ink:#1A1A1A;
    --muted:#6B7280;
    --page:#F2F4F5;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--page); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex; justify-content:center; align-items:center;
    padding:24px 16px;
  }

  .phone{
    width:390px; max-width:100%; background:#fff;
    border-radius:38px; border:1px solid #D4D8DB;
    box-shadow:0 18px 44px rgba(16,24,40,.16);
    padding:12px 10px 16px; position:relative;
    transition: width .2s ease;
  }
  .phone.wide{
    width:860px;
  }
  .status{
    display:flex; justify-content:space-between; align-items:center;
    padding:4px 16px 10px; font-size:13px; font-weight:600;
  }
  .status .icons{letter-spacing:2px; font-size:11px;}
  .screen{padding:0 18px 8px; min-height:560px; display:flex; flex-direction:column;}

  .brandrow{display:flex; justify-content:space-between; align-items:flex-start;}
  .brand{font-size:25px; font-weight:800; color:var(--tt-green-dark); letter-spacing:-.5px;}
  .brand em{font-style:italic; font-weight:700;}
  .qmark{
    width:26px; height:26px; border-radius:50%; border:2px solid var(--tt-green);
    color:var(--tt-green); font-size:15px; font-weight:700;
    display:flex; align-items:center; justify-content:center; margin-top:3px;
  }
  .section-label{
    color:var(--tt-green-dark); font-weight:800; font-size:17px; margin:2px 0 14px;
  }

  /* ---- preamble ---- */
  .intro h1{font-size:19px; line-height:1.3; margin:6px 0 14px;}
  .intro p{font-size:14.5px; line-height:1.5; margin:0 0 12px; color:#33383D;}
  .intro .lead{font-weight:600; color:var(--ink);}

  /* ---- task ---- */
  .stem{font-size:15px; font-weight:600; line-height:1.35; margin:0 0 5px;}
  .assume{font-size:12.5px; color:var(--muted); line-height:1.4; margin:0 0 14px;}
  .tasknum{font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:0 0 6px;}

  .opt{
    display:flex; gap:11px; align-items:flex-start;
    padding:10px 4px 10px 0; cursor:pointer; border-radius:10px;
  }
  .opt:hover{background:#FAFBFB;}
  .radio{
    flex:0 0 21px; width:21px; height:21px; border-radius:50%;
    border:2px solid var(--tt-green); margin-top:2px; position:relative; background:#fff;
  }
  .opt.sel .radio{background:var(--tt-green); border-color:var(--tt-green);}
  .opt.sel .radio::after{
    content:"✓"; position:absolute; inset:0; color:#fff; font-size:13px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .optbody{font-size:13.5px; line-height:1.45;}
  .opt.sel .optbody{font-weight:700;}
  .opt:not(.sel) .optbody{color:#3F4348;}
  .jobline{margin:0 0 3px;}
  .jobline b{font-weight:800;}
  .opt:not(.sel) .jobline b{font-weight:700; color:var(--ink);}

  .spacer{flex:1;}
  .nextwrap{display:flex; justify-content:flex-end; gap:10px; padding:14px 4px 6px;}
  .next{
    background:var(--tt-green); color:#fff; border:0; border-radius:26px;
    padding:12px 34px; font-size:16px; font-weight:700; cursor:pointer;
    font-family:inherit;
  }
  .next:disabled{opacity:.4; cursor:not-allowed;}
  .next:focus-visible{outline:3px solid #0B5; outline-offset:2px;}
  .ghost{
    background:#fff; color:var(--tt-green-dark); border:2px solid #D4D8DB; border-radius:26px;
    padding:10px 24px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .ghost:hover{border-color:var(--tt-green);}
  .homebar{width:130px; height:5px; border-radius:3px; background:#111; margin:12px auto 2px;}

  .end{text-align:center; padding:40px 10px;}
  .end h2{font-size:20px; margin:0 0 8px;}
  .end p{font-size:14px; color:var(--muted); margin:0;}

  textarea{
    width:100%; border:1px solid #D4D8DB; border-radius:10px;
    padding:11px 12px; font-size:14px; line-height:1.45; font-family:inherit;
    color:var(--ink); resize:vertical; margin-top:4px;
  }
  textarea:focus{outline:2px solid var(--tt-green); outline-offset:1px; border-color:var(--tt-green);}
  textarea::placeholder{color:#A8AEB4;}

  /* ---- explore stage ---- */
  .explore-title{font-size:20px; font-weight:800; margin:4px 0 4px;}
  .explore-sub{font-size:13.5px; color:var(--muted); line-height:1.4; margin:0 0 18px;}
  .backlink{
    font-size:13px; color:var(--muted); cursor:pointer; margin:0 0 14px;
    display:inline-flex; align-items:center; gap:5px; font-weight:600;
  }
  .backlink:hover{color:var(--tt-green-dark);}
  .menu-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:10px;}
  .menu-card{
    border:2px solid #E3E6E8; border-radius:16px; padding:18px 16px;
    cursor:pointer; background:#fff; transition:.15s;
  }
  .menu-card:hover{border-color:var(--tt-green);}
  .menu-card h4{font-size:15px; font-weight:800; margin:0 0 8px; line-height:1.3;}
  .menu-badge{
    display:inline-block; font-size:11px; font-weight:700; padding:3px 9px;
    border-radius:20px; background:#EEF1F2; color:var(--muted);
  }
  .menu-badge.done{background:#DFF6F1; color:var(--tt-green-dark);}
  .card-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:14px;}
  .name-row{display:flex; gap:12px; margin-bottom:10px; flex-wrap:wrap;}
  .name-row .opt-card{flex:1 1 0; min-width:160px; text-align:center;}
  .opt-card{
    border:2px solid #E3E6E8; border-radius:14px; padding:16px 18px;
    cursor:pointer; background:#fff; transition:.15s;
  }
  .opt-card:hover{border-color:var(--tt-green);}
  .opt-card.sel{border-color:var(--tt-green); background:#F0FBF9;}
  .opt-card h5{margin:0; font-size:14.5px; font-weight:800; line-height:1.3;}
  .opt-card .lvl{font-size:13px; color:#3F4348; line-height:1.5; margin:0 0 2px;}
  .opt-card.sel .lvl{color:var(--ink);}

  .cmp-table{width:100%; border-collapse:collapse; margin-bottom:10px; table-layout:fixed;}
  .cmp-table th, .cmp-table td{
    border:1px solid #E3E6E8; padding:11px 13px; font-size:13px; line-height:1.5;
    text-align:left; vertical-align:top; cursor:pointer;
  }
  .cmp-table th{
    font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase;
    letter-spacing:.4px; background:#FAFBFB;
  }
  .cmp-table td.sel, .cmp-table th.sel{background:#F0FBF9; border-color:var(--tt-green);}
  .cmp-table td.sel{font-weight:700; color:var(--ink);}
  .cmp-table tr td:not(.sel):hover{background:#FAFBFB;}
  .comp-card{
    border:2px solid #E3E6E8; border-radius:14px; padding:16px 18px; margin-bottom:16px; background:#FAFBFB;
  }
  .comp-card h5{margin:0 0 9px; font-size:14.5px; font-weight:800;}
  .comp-card .lvl{font-size:13px; color:#3F4348; line-height:1.5; margin:0 0 2px;}
  .summary-block{
    border:2px solid #E3E6E8; border-radius:14px; padding:16px 18px; margin-bottom:14px;
  }
  .summary-block h5{margin:0 0 4px; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;}
  .summary-block h4{margin:0 0 9px; font-size:15px; font-weight:800;}
  .summary-block .lvl{font-size:13.5px; line-height:1.5; margin:0 0 2px;}
  .summary-empty{color:var(--muted); font-size:13px; font-style:italic;}
</style>
</head>
<body>

<div class="phone">
  <div class="status">
    <span>12:43</span>
    <span class="icons">▪▪▫ ᯤ ▮</span>
  </div>
  <div class="screen">
    <div class="brandrow">
      <div class="brand">Teacher<em>Tally</em></div>
      <div class="qmark">?</div>
    </div>
    <div class="section-label">Extra Questions</div>
    <div id="view"></div>
  </div>
  <div class="homebar"></div>
</div>

<script>
/* ============================================================
   ATTRIBUTES — edit level wording here
   ============================================================ */
const ATTR = {
  hours:      { name:"Hours actually worked",       levels:["50 to 54 hours","45 to 49 hours","40 to 44 hours"] },
  support:    { name:"Support staff to reduce workload", levels:["None available","Some for specific tasks","Dedicated and regularly available"] },
  maternity:  { name:"Paid maternity leave",        levels:["66% pay for 18 weeks","100% pay for 18 weeks","100% pay for 24 weeks"] },
  wfh:        { name:"Days working from home",      levels:["None","Half a day a week","2 days a week"] },
  outside:    { name:"Work outside contracted hours", levels:["Regular evening and weekend work","Occasional","Rare"] },
  paternity:  { name:"Paid paternity leave",        levels:["90% pay for 2 weeks","100% pay for 18 weeks","100% pay for 24 weeks"] },
  flexstart:  { name:"Start and finish times",      levels:["Fixed start and finish times","Start later or finish earlier, once a fortnight","Start later or finish earlier, once a week"] },
  appts:      { name:"Time off for appointments",   levels:["Discouraged","Accommodated with advance planning","Flexibly supported when needed"] },
  parttime:   { name:"Part-time and job sharing",   levels:["Discouraged","Considered case by case","Actively supported"] },
  compressed: { name:"Compressed working week",     levels:["Standard 5-day week","9-day fortnight available","4-day week available"] },
  salary:     { name:"Salary",                      levels:["10% lower than current","Same as current","10% higher than current"] },
};

/* ============================================================
   DECKS — salary always last
   ============================================================ */
const DECKS = [
  ["hours","support","maternity","salary"],
  ["wfh","outside","paternity","salary"],
  ["flexstart","appts","parttime","compressed","salary"],
];

/* ============================================================
   FIXED TASKS
   ============================================================ */
const TASKS = [
  { deck:0, pairs:{ hours:[0,2], support:[1,0], maternity:[2,0], salary:[1,2] } },
  { deck:0, pairs:{ hours:[1,0], support:[2,1], maternity:[1,2], salary:[0,1] } },
  { deck:1, pairs:{ wfh:[0,2], outside:[1,0], paternity:[2,0], salary:[1,2] } },
  { deck:1, pairs:{ wfh:[1,0], outside:[2,1], paternity:[1,2], salary:[0,1] } },
  { deck:2, pairs:{ flexstart:[0,2], appts:[1,0], parttime:[2,0], compressed:[0,1], salary:[1,2] } },
  { deck:2, pairs:{ flexstart:[1,0], appts:[2,1], parttime:[1,2], compressed:[2,0], salary:[0,1] } },
];

const TOTAL_GROUPS = DECKS.length;
function groupOf(taskIdx){ return TASKS[taskIdx].deck + 1; }
function isLastInGroup(taskIdx){
  return taskIdx === TASKS.length - 1 || TASKS[taskIdx + 1].deck !== TASKS[taskIdx].deck;
}

/* ============================================================
   EXPLORE STAGE — name and wording options for the four
   "process" attributes. Current wording is always option A.
   ============================================================ */
const EXPLORE_ORDER = ["parttime","appts","compressed","wfh"];

const EXPLORE = {
  parttime: {
    label: "Part-time and job sharing",
    comprehensionCheck: false,
    names: [
      { id:"A", text:"Part-time and job sharing" },
      { id:"B", text:"Reduced hours or job share" },
      { id:"C", text:"Flexibility over how much you work" },
      { id:"D", text:"Working part-time" },
    ],
    levels: [
      { id:"A", vals:["Discouraged","Considered case by case","Actively supported"] },
      { id:"B", vals:["Not something staff have managed to arrange","Some staff have arranged it","Common, with staff currently doing it"] },
      { id:"C", vals:["Almost never approved","About half approved","Almost always approved"] },
      { id:"D", vals:["Neither reduced hours nor job share available","Reduced hours or job share considered individually","Reduced hours and job share both actively offered"] },
    ]
  },
  appts: {
    label: "Time off for appointments",
    comprehensionCheck: false,
    names: [
      { id:"A", text:"Time off for appointments" },
      { id:"B", text:"Time off for personal matters" },
      { id:"C", text:"Time off during the working day" },
      { id:"D", text:"Flexibility for personal commitments" },
    ],
    levels: [
      { id:"A", vals:["Discouraged","Accommodated with advance planning","Flexibly supported when needed"] },
      { id:"B", vals:["Discouraged","One-off events accepted in advance","One-off events supported, even at short notice"] },
      { id:"C", vals:["Rarely approved","Usually approved within a day","Approved on the day, if needed"] },
      { id:"D", vals:["Not something staff have been able to get time off for","Staff can usually arrange this","Easily arranged, whenever needed"] },
    ]
  },
  compressed: {
    label: "Compressed working week",
    comprehensionCheck: true,
    names: [
      { id:"A", text:"Compressed working week" },
      { id:"B", text:"Working hours spread differently" },
      { id:"C", text:"Days worked each week" },
      { id:"D", text:"Reduced or restructured working week" },
    ],
    levels: [
      { id:"A", vals:["Standard 5-day week","9-day fortnight available","4-day week available"] },
      { id:"B", vals:["Standard 5-day week","Same weekly hours as now, over 9 days","Same weekly hours as now, over 4 days"] },
      { id:"C", vals:["Standard 5-day week","Fewer weekly hours than now, over 9 days","Fewer weekly hours than now, over 4 days"] },
    ]
  },
  wfh: {
    label: "Days working from home",
    comprehensionCheck: false,
    names: [
      { id:"A", text:"Days working from home" },
      { id:"B", text:"Flexible working location" },
      { id:"C", text:"Time away from site" },
    ],
    levels: [
      { id:"A", vals:["None","Half a day a week","2 days a week"] },
      { id:"B", vals:["None","Up to 1 hour a week, taken flexibly","Up to 2 hours a week, taken flexibly"] },
      { id:"C", vals:["None","Half a day a week at home, for planning","2 days a week at home, for planning"] },
      { id:"D", vals:["No flexibility to work away from site","Some flexibility to work away from site around personal commitments","Regular flexibility to work away from site around personal commitments"] },
    ]
  },
};

/* ============================================================ */
let stage = "intro";
let idx = 0;
const picks = {};
const view = document.getElementById("view");

// explore state
let exploreAttr = null;         // current attribute key being explored
let exploreStep = null;         // "name" | "comprehension" | "levels"
const explorePicks = {};        // { attrKey: { name:"B", level:"C" } }
let tempNamePick = null;        // holds name selection mid-flow

function isExploreStage(s){ return s && s.indexOf("explore") === 0; }

function renderIntro(){
  view.innerHTML =
    '<div class="intro">' +
      '<h1>Before you start</h1>' +
      '<p class="lead">You will see some pairs of jobs.</p>' +
      '<p>Everything listed about each job is accurate and reflects the actual working conditions of that job.</p>' +
      '<p>For each pair, choose the job you would prefer.</p>' +
      '<p>Assume the two jobs are identical in every other respect.</p>' +
      '<p>There are no right answers.</p>' +
    '</div>' +
    '<div class="spacer"></div>' +
    '<div class="nextwrap"><button class="next" id="go">Start</button></div>';
  document.getElementById("go").onclick = () => { stage = "task"; render(); };
}

function renderTask(){
  const t = TASKS[idx];
  const deck = DECKS[t.deck];
  const labels = ["Job A offers:", "Job B offers:"];

  let html =
    '<p class="tasknum">Task ' + (idx + 1) + ' of ' + TASKS.length + '</p>' +
    '<p class="stem">Which job would you prefer?</p>' +
    '<p class="assume">Assume the jobs are identical in every other respect.</p>';

  ["A","B"].forEach((side, si) => {
    html +=
      '<div class="opt' + (picks[idx] === side ? " sel" : "") + '" data-side="' + side + '">' +
        '<div class="radio"></div><div class="optbody">' +
        '<div class="jobline">' + labels[si] + '</div>' +
        deck.map(a =>
          '<div class="jobline"><b>' + ATTR[a].name + ':</b> ' +
          ATTR[a].levels[ t.pairs[a][si] ] + '</div>'
        ).join("") +
        '</div>' +
      '</div>';
  });

  html +=
    '<div class="spacer"></div>' +
    '<div class="nextwrap"><button class="next" id="next"' +
    (picks[idx] ? "" : " disabled") + '>Next</button></div>';

  view.innerHTML = html;

  view.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => { picks[idx] = el.dataset.side; render(); };
  });
  document.getElementById("next").onclick = () => {
    if(idx === TASKS.length - 1){ stage = "feedback"; }
    else if(isLastInGroup(idx)){ stage = "pause"; }
    else { idx++; }
    render();
  };
}

function renderPause(){
  view.innerHTML =
    '<div class="end" style="padding-top:80px;">' +
      '<h2>Task ' + (idx + 1) + ' of ' + TASKS.length + ' done</h2>' +
      '<p>Take a moment before the next one.</p>' +
    '</div>' +
    '<div class="nextwrap"><button class="next" id="cont">Continue</button></div>';
  document.getElementById("cont").onclick = () => { idx++; stage = "task"; render(); };
}

function renderFeedback(){
  view.innerHTML =
    '<div class="intro">' +
      '<p class="stem" style="margin-bottom:10px;">What were you thinking about as you answered these questions?</p>' +
      '<p class="assume">Talk me through what stood out, what you weighed up, and anything that was unclear, confusing, or that you were unsure how to read. Nothing is too small to mention.</p>' +
    '</div>' +
    '<div class="spacer"></div>' +
    '<div class="nextwrap"><button class="next" id="fin">Continue</button></div>';
  document.getElementById("fin").onclick = () => { stage = "exploreIntro"; render(); };
}

/* ---------------- explore stage ---------------- */

function renderExploreIntro(){
  view.innerHTML =
    '<div class="explore-title">A few different ways to ask this</div>' +
    '<p class="explore-sub">Now we would like to look at a few different ways some of these questions could be written, and get your reactions.</p>' +
    '<div class="spacer"></div>' +
    '<div class="nextwrap"><button class="next" id="go2">Start</button></div>';
  document.getElementById("go2").onclick = () => { stage = "exploreMenu"; render(); };
}

function renderExploreMenu(){
  const cards = EXPLORE_ORDER.map(key => {
    const attr = EXPLORE[key];
    const done = !!(explorePicks[key] && explorePicks[key].name && explorePicks[key].level);
    return '<div class="menu-card" data-key="' + key + '">' +
      '<h4>' + attr.label + '</h4>' +
      '<span class="menu-badge' + (done ? " done" : "") + '">' + (done ? "Reviewed" : "Not reviewed yet") + '</span>' +
    '</div>';
  }).join("");

  view.innerHTML =
    '<div class="explore-title">Pick one to look at</div>' +
    '<p class="explore-sub">In any order you like.</p>' +
    '<div class="menu-grid">' + cards + '</div>' +
    '<div class="spacer"></div>' +
    '<div class="nextwrap"><button class="next" id="toSummary">Finish</button></div>';

  view.querySelectorAll(".menu-card").forEach(el => {
    el.onclick = () => {
      exploreAttr = el.dataset.key;
      tempNamePick = explorePicks[exploreAttr] ? explorePicks[exploreAttr].name : null;
      stage = "exploreName";
      render();
    };
  });
  document.getElementById("toSummary").onclick = () => { stage = "exploreSummary"; render(); };
}

function renderExploreName(){
  const attr = EXPLORE[exploreAttr];
  const cards = attr.names.map(n =>
    '<div class="opt-card' + (tempNamePick === n.id ? " sel" : "") + '" data-id="' + n.id + '">' +
      '<h5>' + n.text + '</h5>' +
    '</div>'
  ).join("");

  view.innerHTML =
    '<div class="backlink" id="back">&larr; Back to menu</div>' +
    '<div class="explore-title">Which name is clearest?</div>' +
    '<p class="explore-sub">' + attr.label + '</p>' +
    '<div class="name-row">' + cards + '</div>' +
    '<div class="spacer"></div>' +
    '<div class="nextwrap"><button class="next" id="nextName"' + (tempNamePick ? "" : " disabled") + '>Continue</button></div>';

  document.getElementById("back").onclick = () => { stage = "exploreMenu"; render(); };
  view.querySelectorAll(".opt-card").forEach(el => {
    el.onclick = () => { tempNamePick = el.dataset.id; render(); };
  });
  document.getElementById("nextName").onclick = () => {
    if(!explorePicks[exploreAttr]) explorePicks[exploreAttr] = {};
    explorePicks[exploreAttr].name = tempNamePick;
    stage = attr.comprehensionCheck ? "exploreComprehension" : "exploreLevels";
    render();
  };
}

function renderExploreComprehension(){
  const attr = EXPLORE[exploreAttr];
  const baseline = attr.levels[0]; // option A

  view.innerHTML =
    '<div class="backlink" id="back">&larr; Back to menu</div>' +
    '<div class="explore-title">Talk it through</div>' +
    '<p class="explore-sub">Before we compare versions, what do you think this currently means?</p>' +
    '<div class="comp-card">' +
      '<h5>' + attr.label + '</h5>' +
      baseline.vals.map(v => '<div class="lvl">' + v + '</div>').join("") +
    '</div>' +
    '<div class="spacer"></div>' +
    '<div class="nextwrap"><button class="next" id="nextComp">Continue</button></div>';

  document.getElementById("back").onclick = () => { stage = "exploreMenu"; render(); };
  document.getElementById("nextComp").onclick = () => { stage = "exploreLevels"; render(); };
}

function renderExploreLevels(){
  const attr = EXPLORE[exploreAttr];
  const currentPick = explorePicks[exploreAttr] ? explorePicks[exploreAttr].level : null;
  const rowCount = Math.max(...attr.levels.map(l => l.vals.length));

  const headCells = attr.levels.map(l =>
    '<th class="cmp-col' + (currentPick === l.id ? " sel" : "") + '" data-id="' + l.id + '">Select</th>'
  ).join("");

  let bodyRows = "";
  for(let r = 0; r < rowCount; r++){
    bodyRows += '<tr>';
    attr.levels.forEach(l => {
      bodyRows += '<td class="cmp-col' + (currentPick === l.id ? " sel" : "") + '" data-id="' + l.id + '">' + (l.vals[r] || "") + '</td>';
    });
    bodyRows += '</tr>';
  }

  view.innerHTML =
    '<div class="backlink" id="back">&larr; Back to menu</div>' +
    '<div class="explore-title">Which version is clearest?</div>' +
    '<p class="explore-sub">' + attr.label + '</p>' +
    '<table class="cmp-table"><thead><tr>' + headCells + '</tr></thead><tbody>' + bodyRows + '</tbody></table>' +
    '<div class="spacer"></div>' +
    '<div class="nextwrap"><button class="ghost" id="another">Try another attribute</button>' +
    '<button class="next" id="saveLevel"' + (currentPick ? "" : " disabled") + '>Save</button></div>';

  document.getElementById("back").onclick = () => { stage = "exploreMenu"; render(); };
  document.getElementById("another").onclick = () => { stage = "exploreMenu"; render(); };
  view.querySelectorAll("[data-id]").forEach(el => {
    el.onclick = () => {
      if(!explorePicks[exploreAttr]) explorePicks[exploreAttr] = {};
      explorePicks[exploreAttr].level = el.dataset.id;
      render();
    };
  });
  document.getElementById("saveLevel").onclick = () => { stage = "exploreMenu"; render(); };
}

function renderExploreSummary(){
  const blocks = EXPLORE_ORDER.map(key => {
    const attr = EXPLORE[key];
    const pick = explorePicks[key];
    if(!pick || !pick.name || !pick.level){
      return '<div class="summary-block"><h5>' + attr.label + '</h5><p class="summary-empty">Not reviewed</p></div>';
    }
    const nameObj = attr.names.find(n => n.id === pick.name);
    const levelObj = attr.levels.find(l => l.id === pick.level);
    return '<div class="summary-block">' +
      '<h5>' + attr.label + '</h5>' +
      '<h4>' + nameObj.text + '</h4>' +
      levelObj.vals.map(v => '<div class="lvl">' + v + '</div>').join("") +
    '</div>';
  }).join("");

  view.innerHTML =
    '<div class="backlink" id="back">&larr; Back to menu</div>' +
    '<div class="explore-title">Here is what we have landed on</div>' +
    '<p class="explore-sub">Based on your choices just now.</p>' +
    blocks +
    '<div class="spacer"></div>' +
    '<div class="nextwrap"><button class="next" id="fin2">Finish</button></div>';

  document.getElementById("back").onclick = () => { stage = "exploreMenu"; render(); };
  document.getElementById("fin2").onclick = () => { stage = "end"; render(); };
}

function renderEnd(){
  view.innerHTML =
    '<div class="end"><h2>That is everything</h2>' +
    '<p>Thank you. Please stay on the call.</p></div>';
}

function render(){
  document.querySelector(".phone").classList.toggle("wide", isExploreStage(stage));
  if(stage === "intro") renderIntro();
  else if(stage === "task") renderTask();
  else if(stage === "pause") renderPause();
  else if(stage === "feedback") renderFeedback();
  else if(stage === "exploreIntro") renderExploreIntro();
  else if(stage === "exploreMenu") renderExploreMenu();
  else if(stage === "exploreName") renderExploreName();
  else if(stage === "exploreComprehension") renderExploreComprehension();
  else if(stage === "exploreLevels") renderExploreLevels();
  else if(stage === "exploreSummary") renderExploreSummary();
  else renderEnd();
}

render();
</script>
</body>
</html>
